name: server-quality

on:
  workflow_dispatch:
  schedule:
    - cron: "23 19 * * 0"
  push:
    paths:
      - "deploy/server"
      - "deploy/server/**"
      - "docker-compose.yml"
      - ".github/workflows/server-quality.yml"
  pull_request:
    paths:
      - "deploy/server"
      - "deploy/server/**"
      - "docker-compose.yml"
      - ".github/workflows/server-quality.yml"

jobs:
  guardrails-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/server
    env:
      DATABASE_URL: postgresql+psycopg://heysure:heysure@127.0.0.1:55432/heysure_unit
      HEYSURE_DB_AUTO_MIGRATE: "0"
      HEYSURE_DB_CONNECT_TIMEOUT_SECONDS: "1"
      HEYSURE_INTERNAL_TOKEN: test-internal-token
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/server/requirements.txt
      - name: Complexity and architecture guardrails
        run: |
          python other/scripts/check_guardrails.py
          python other/scripts/check_architecture.py
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Unit and contract tests
        run: pytest -q -m "not integration and not e2e and not deployment"
      - name: State-machine branch coverage
        run: >-
          pytest -q
          other/tests/unit/test_model_error_flow.py
          other/tests/unit/test_tool_batch_flow.py
          other/tests/unit/test_turn_call_flow.py
          other/tests/unit/test_worker_turn_flow.py
          other/tests/unit/test_dispatch_state_machine.py
          --cov=ai_runtime.inference.model_error_flow
          --cov=ai_runtime.inference.tool_batch_flow
          --cov=ai_runtime.inference.turn_call_flow
          --cov=ai_runtime.inference.worker_turn_flow
          --cov=connector_runtime.dispatch.models
          --cov-branch
          --cov-report=term
          --cov-fail-under=90

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: heysure
          POSTGRES_PASSWORD: heysure
          POSTGRES_DB: heysure_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heysure -d heysure_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: deploy/server
    env:
      DATABASE_URL: postgresql+psycopg://heysure:heysure@localhost:5432/heysure_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://heysure:heysure@localhost:5432/heysure_test
      HEYSURE_DB_AUTO_MIGRATE: "0"
      HEYSURE_INTERNAL_TOKEN: test-internal-token
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: deploy/server/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-cov
      - name: Migrate and verify model drift
        run: |
          alembic upgrade head
          alembic check
      - name: PostgreSQL integration and deployment contracts
        run: pytest -q -m "integration or e2e or deployment"

  four-runtime-smoke:
    runs-on: ubuntu-latest
    env:
      HEYSURE_INTERNAL_TOKEN: ci-four-runtime-token
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and start all runtimes
        run: docker compose up -d --build db api-gateway mcp-runtime connector-runtime ai-runtime
      - name: Show runtime state
        if: always()
        run: docker compose ps
      - name: Login and simulated Agent dispatch smoke
        run: >-
          docker compose exec -T api-gateway python
          other/scripts/smoke_four_runtime.py
          --gateway http://api-gateway:3000
          --connector http://connector-runtime:3002
          --internal-token "$HEYSURE_INTERNAL_TOKEN"
      - name: Runtime restart fault exercise
        run: |
          ITERATIONS=2
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then ITERATIONS=20; fi
          python3 deploy/server/other/scripts/restart_fault_exercise.py \
            --iterations "$ITERATIONS" \
            --internal-token "$HEYSURE_INTERNAL_TOKEN"
      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300 api-gateway mcp-runtime connector-runtime ai-runtime db-migrate db
      - name: Stop stack
        if: always()
        run: docker compose down -v
