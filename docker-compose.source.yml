# Development-only override. Production uses docker-compose.yml and fixed
# images; this file is the explicit opt-in path for local source builds.
services:
  db-migrate:
    build:
      context: ./deploy/server
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        ALL_PROXY: ${DOCKER_ALL_PROXY:-}
    volumes:
      - ./deploy/server:/app

  api-gateway:
    build:
      context: ./deploy/server
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        ALL_PROXY: ${DOCKER_ALL_PROXY:-}
    volumes:
      - ./deploy/server:/app

  ai-runtime:
    build:
      context: ./deploy/server
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        ALL_PROXY: ${DOCKER_ALL_PROXY:-}
    volumes:
      - ./deploy/server:/app

  mcp-runtime:
    build:
      context: ./deploy/server
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        ALL_PROXY: ${DOCKER_ALL_PROXY:-}
    volumes:
      - ./deploy/server:/app

  connector-runtime:
    build:
      context: ./deploy/server
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        ALL_PROXY: ${DOCKER_ALL_PROXY:-}
    volumes:
      - ./deploy/server:/app

  web:
    build:
      context: ./deploy/web
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        HTTP_PROXY: ${DOCKER_HTTP_PROXY:-}
        HTTPS_PROXY: ${DOCKER_HTTPS_PROXY:-}
        ALL_PROXY: ${DOCKER_ALL_PROXY:-}
    volumes:
      - ./deploy/web:/app
      - web_node_modules:/app/node_modules

volumes:
  web_node_modules:
